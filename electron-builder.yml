appId: io.github.abehan7.tiktokposter
productName: TikTok Poster
directories:
  output: dist
files:
  - out/**
extraResources:
  - from: resources/bin
    to: bin
mac:
  icon: build/icon.icns
  category: public.app-category.social-networking
  target:
    - target: dmg
      arch: [arm64, x64]
  artifactName: TikTok-Poster-${version}-${arch}.${ext}
dmg:
  title: TikTok Poster ${version}
